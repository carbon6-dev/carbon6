[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]
# The website is a workspace of its own (see site/Cargo.toml).
exclude = ["site"]
default-members = ["crates/c6-proto", "crates/c6-core", "crates/c6-api", "crates/c6-llm", "crates/c6-agent", "crates/c6-tools", "crates/c6-mcp", "crates/c6-testkit", "crates/c6-head", "crates/c6-worker", "crates/c6-memex", "bins/c6h", "bins/c6w", "bins/c6"]

[workspace.package]
version = "0.3.6"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/carbon6-dev/carbon6"

[workspace.dependencies]
c6-proto = { path = "crates/c6-proto" }
c6-core = { path = "crates/c6-core" }
c6-api = { path = "crates/c6-api" }
c6-head = { path = "crates/c6-head" }
c6-worker = { path = "crates/c6-worker" }
c6-memex = { path = "crates/c6-memex" }
c6-llm = { path = "crates/c6-llm" }
c6-agent = { path = "crates/c6-agent" }
c6-tools = { path = "crates/c6-tools" }
c6-mcp = { path = "crates/c6-mcp" }
c6-testkit = { path = "crates/c6-testkit" }

# Dependencies without debug info: much smaller test binaries, which link
# faster and (on macOS) are scanned faster before their first launch. Our
# own crates keep full debug info.
[profile.dev.package."*"]
debug = false

# tract (the memex's ONNX models) optimized even in dev builds: unoptimized,
# its generic code makes the memex's test binaries' unwind tables too big
# for macOS's linker to encode compactly (a linker warning), and the models
# run far slower.
[profile.dev.package.tract-core]
opt-level = 1

[profile.dev.package.tract-data]
opt-level = 1

[profile.dev.package.tract-extra]
opt-level = 1

[profile.dev.package.tract-hir]
opt-level = 1

[profile.dev.package.tract-linalg]
opt-level = 1

[profile.dev.package.tract-nnef]
opt-level = 1

[profile.dev.package.tract-onnx]
opt-level = 1

[profile.dev.package.tract-onnx-opl]
opt-level = 1

[profile.dev.package.tract-transformers]
opt-level = 1
