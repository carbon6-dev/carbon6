# The one Rust version carbon6 builds with: rustup uses it here (local
# builds, worktrees), CI installs it (.github/actions/rust), and the Docker
# builds get it from the Makefile (RUST_VERSION).
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
