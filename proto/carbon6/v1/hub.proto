syntax = "proto3";

package carbon6.v1;

import "carbon6/v1/session.proto";

// One-time enrollment. Served on the worker port over server-authenticated
// TLS; the caller has no client certificate yet.
service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  string secret = 1;   // from the enrollment token
  string csr_pem = 2;  // worker-generated key never leaves the worker
  string hostname = 3;
  string os = 4;
  string arch = 5;
  string version = 6;
}

message EnrollResponse {
  string worker_id = 1;
  string worker_name = 2;
  string cert_pem = 3;
  string ca_pem = 4;
}

// Long-lived worker connection. Requires an mTLS client certificate issued at
// enrollment; the worker id is taken from the certificate, never the payload.
service WorkerHub {
  rpc Attach(stream WorkerMsg) returns (stream HeadMsg);
}

message WorkerMsg {
  oneof msg {
    Hello hello = 1; // must be first
    Ping ping = 2;
    SessionEventBatch events = 3;
    EphemeralEvent ephemeral = 4;
    CommandRejected rejected = 5;
    CredentialRequest credential_request = 6;
  }
}

message HeadMsg {
  oneof msg {
    Welcome welcome = 1;
    Pong pong = 2;
    EventAck ack = 3;
    SessionCommand command = 4;
    CredentialGrant credential = 5;
  }
}

message Hello {
  uint32 protocol_version = 1;
  string version = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  repeated string capabilities = 6;
  // Last journaled seq of every session with events the head may not have.
  repeated SessionCursor sessions = 7;
}

message Welcome {
  uint32 protocol_version = 1;
  string head_version = 2;
  string worker_id = 3;
  string worker_name = 4;
  // Head's durable position for each session in Hello; the worker resends
  // everything after it.
  repeated SessionCursor acks = 5;
}

message Ping {
  uint64 nonce = 1;
  // Round-trip time measured on the previous ping, for display on the head.
  uint32 last_rtt_us = 2;
}

message Pong {
  uint64 nonce = 1;
}
