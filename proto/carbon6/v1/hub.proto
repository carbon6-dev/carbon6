syntax = "proto3";

package carbon6.v1;

import "carbon6/v1/session.proto";

// One-time enrollment. Served on the worker port over server-authenticated
// TLS; the caller has no client certificate yet.
service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  string secret = 1;   // from the enrollment token
  string csr_pem = 2;  // worker-generated key never leaves the worker
  string hostname = 3;
  string os = 4;
  string arch = 5;
  string version = 6;
}

message EnrollResponse {
  string worker_id = 1;
  string worker_name = 2;
  string cert_pem = 3;
  string ca_pem = 4;
}

// Long-lived worker connection. Requires an mTLS client certificate issued at
// enrollment; the worker id is taken from the certificate, never the payload.
service WorkerHub {
  rpc Attach(stream WorkerMsg) returns (stream HeadMsg);

  // A terminal's byte stream. Opened by the worker when the head asks it to
  // (RpcRequest "pty.attach"), so terminal traffic gets its own HTTP/2
  // stream and never delays the control stream.
  rpc Pty(stream PtyFrame) returns (stream PtyFrame);
}

message PtyFrame {
  oneof frame {
    PtyOpen open = 1;     // worker -> head, first frame: which attach this is
    bytes data = 2;       // output (worker -> head) or input (head -> worker)
    PtySize resize = 3;   // head -> worker
    PtyExit exit = 4;     // worker -> head
  }
}

message PtyOpen {
  string terminal_id = 1;
  string attach_token = 2;
}

message PtySize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message PtyExit {
  int32 code = 1;
}

// Head -> worker request with a JSON payload; answered by RpcResponse.
message RpcRequest {
  uint64 id = 1;
  string method = 2;
  bytes params_json = 3;
}

message RpcResponse {
  uint64 id = 1;
  bytes result_json = 2;
  string error = 3; // set on failure
}

// Node -> head request with a JSON payload; answered by HeadCallReply. What
// a node may call depends on its role (worker or memex): workers reach the
// memex through the head this way, and the memex asks the head for its
// settings or to notify you.
message HeadCall {
  uint64 id = 1;
  string method = 2;
  bytes params_json = 3;
}

message HeadCallReply {
  uint64 id = 1;
  bytes result_json = 2;
  string error = 3; // set on failure
}

message WorkerMsg {
  oneof msg {
    Hello hello = 1; // must be first
    Ping ping = 2;
    SessionEventBatch events = 3;
    EphemeralEvent ephemeral = 4;
    CommandRejected rejected = 5;
    CredentialRequest credential_request = 6;
    RpcResponse rpc_response = 7;
    HeadCall head_call = 8;
    MachineSample machine_sample = 9;
  }
}

// Observational, best-effort telemetry; JSON c6_api::machines::MachineSample.
// Old peers ignore this fresh tag rather than blocking event ingestion.
message MachineSample {
  bytes sample_json = 1;
}

message HeadMsg {
  oneof msg {
    Welcome welcome = 1;
    Pong pong = 2;
    EventAck ack = 3;
    SessionCommand command = 4;
    CredentialGrant credential = 5;
    RpcRequest rpc_request = 6;
    HeadCallReply head_call_reply = 7;
  }
}

message Hello {
  uint32 protocol_version = 1;
  string version = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  repeated string capabilities = 6;
  // Last journaled seq of every session with events the head may not have.
  repeated SessionCursor sessions = 7;
}

message Welcome {
  uint32 protocol_version = 1;
  string head_version = 2;
  string worker_id = 3;
  string worker_name = 4;
  // Head's durable position for each session in Hello; the worker resends
  // everything after it.
  repeated SessionCursor acks = 5;
  optional uint64 machine_sample_secs = 6;
  optional double machine_disk_hold_percent = 7;
}

message Ping {
  uint64 nonce = 1;
  // Round-trip time measured on the previous ping, for display on the head.
  uint32 last_rtt_us = 2;
  // Absent on older workers. An omitted session is unknown, not stopped.
  SessionLivenessReport liveness = 3;
}

message SessionLivenessReport {
  repeated SessionLiveness sessions = 1;
}

message SessionLiveness {
  string session_id = 1;
  uint64 ownership_epoch = 2;
  SessionActorState actor_state = 3;
  string reason = 4;
  SessionActivityKind activity_kind = 5;
  HeldProcessState held_process = 6;
  // Running background tasks tracked by the local runtime (all kinds).
  uint32 running_background_tasks = 7;
  // Counted running background work, excluding carbon6 subagent waits.
  // Opaque native Claude Code tasks remain CLI work, including native agents.
  uint32 running_background_processes = 8;
  // activity_kind remains TOOL for compatibility with older heads.
  bool waiting_on_subagents = 9;
}

enum SessionActorState {
  SESSION_ACTOR_STATE_UNSPECIFIED = 0;
  SESSION_ACTOR_STATE_IDLE = 1;
  SESSION_ACTOR_STATE_RUNNING = 2;
  SESSION_ACTOR_STATE_RECOVERING = 3;
  SESSION_ACTOR_STATE_STOPPED = 4;
  // Actor has not reached its mailbox loop recently; not proof of exit.
  SESSION_ACTOR_STATE_UNRESPONSIVE = 5;
  // Resource wait, retried automatically without a recovery deadline.
  SESSION_ACTOR_STATE_WAITING_FOR_DISK = 6;
}

enum SessionActivityKind {
  SESSION_ACTIVITY_KIND_UNSPECIFIED = 0;
  SESSION_ACTIVITY_KIND_MODEL = 1;
  SESSION_ACTIVITY_KIND_TOOL = 2;
  // Worker-internal classification; reports send TOOL plus waiting_on_subagents.
  SESSION_ACTIVITY_KIND_SUBAGENT = 3;
}

enum HeldProcessState {
  HELD_PROCESS_STATE_UNSPECIFIED = 0;
  HELD_PROCESS_STATE_NONE = 1;
  // A held Claude Code wrapper and its keeper appear live on this worker.
  HELD_PROCESS_STATE_RUNNING = 2;
  // The wrapper exited or the recorded keeper no longer owns the group.
  // Does not prove that every descendant stopped.
  HELD_PROCESS_STATE_EXITED = 3;
}

message Pong {
  uint64 nonce = 1;
}
