syntax = "proto3";

package carbon6.v1;

// ---------------------------------------------------------------------------
// Durable session events. Each session is an append-only log written only by
// the worker running it; `seq` starts at 1 and has no gaps.
// ---------------------------------------------------------------------------

message SessionEvent {
  uint64 seq = 1;
  int64 ts_ms = 2;
  oneof kind {
    SessionStarted started = 10;
    UserMessage user = 11;
    TurnStarted turn_started = 12;
    AssistantMessage assistant = 13;
    ToolResult tool_result = 14;
    Usage usage = 15;
    TurnEnded turn_ended = 16;
    ErrorEvent error = 17;
    Compaction compaction = 18;
    ModelSwitched model_switched = 19;
    Checkpoint checkpoint = 20;
    Rewound rewound = 21;
    BackgroundTask background_task = 22;
    Output output = 23;
    MemoryUpdate memory = 24;
    Approval approval = 25;
    Notice notice = 26;
    Question question = 27;
    SubagentSpawned subagent_spawned = 28;
    SubagentModelSet subagent_model_set = 29;
    SubagentReported subagent_reported = 30;
    NoticeQueued notice_queued = 31;
    InputDelivered input_delivered = 32;
  }
}

// One of your messages reached the agent while it was working: it is in
// the session's inbox, or written to its Claude Code process, and the
// agent reads it at its next step (its UserMessage then). Until then the
// head shows it as with the agent rather than queued.
message InputDelivered {
  string command_id = 1;
}

// The head brought a remote subagent's report (DelegationEnded) to this
// session, its parent (docs/remote-subagents.md). It marks that command
// applied; the report itself goes to the call waiting on it, or comes as a
// notice.
message SubagentReported {
  string command_id = 1;
  // The call that waited on it; empty for a turn no call waited on.
  string call_id = 2;
  string child_session_id = 3;
  // completed, interrupted, failed or lost.
  string status = 4;
}

// A notice for the agent (a background task's end, a subagent's report)
// was queued: written before it is delivered, so a reload delivers one
// that no turn took (a UserMessage with the same command_id), under the
// same rule (docs/background.md §5).
message NoticeQueued {
  string command_id = 1;
  // What the agent is told.
  string text = 2;
  // The input's command ("task-notification").
  string command = 3;
  // An idle session starts a turn on it (within the hourly limit); else it
  // waits for the next input.
  bool wake = 4;
  // What the model gets instead of the text (a session message's wrapper).
  string prompt = 5;
  // A session message's sender, its title and hops (UserInput's).
  string from_session_id = 6;
  string from_title = 7;
  uint32 hops = 8;
  // When the hourly limit next permits this notice's automatic delivery
  // (Unix milliseconds); zero if it is not held by the limit.
  int64 deliver_at_ms = 9;
  TaskNotice task_notice = 10;
}

// The session's default for its subagents changed (you picked one in the
// session); unset `model`: they run on the session's own model. A Task call
// or a named agent that asks for its own still wins.
message SubagentModelSet {
  ModelSpec model = 1;
  // The SetSubagentModel command it applies.
  string command_id = 2;
}

// A tool call (Task) started a subagent: written to the parent's log before
// the subagent's own, so the parent links to its children by itself.
message SubagentSpawned {
  string call_id = 1;
  string child_session_id = 2;
  // The named agent; empty for a general-purpose one.
  string agent = 3;
  string description = 4;
  // Set when it runs in the background (the BackgroundTask's id).
  string background_task_id = 5;
  // The connection, model and effort it runs on.
  ModelSpec model = 6;
  // Set for a remote subagent: a session the head started from a template,
  // perhaps on another worker (docs/remote-subagents.md).
  RemoteSubagent remote = 7;
}

// Where a remote subagent runs.
message RemoteSubagent {
  string template = 1;
  string worker_id = 2;
  string worker_name = 3;
  // An SSH target or host it works on through that worker, if any.
  string target = 4;
  string cwd = 5;
}

// The assistant asked you for inputs (a form), and what became of it.
message Question {
  string call_id = 1;
  string title = 2;
  // The fields (JSON array: name, label, type, choices, default, required,
  // description).
  string fields_json = 3;
  // "asked", "answered" or "cancelled".
  string state = 4;
  // Your answers (JSON object; secret fields shown as "[secret]").
  string answer_json = 5;
}

// The agent asked to tell you something (notify): the head sends it to
// your notification channels.
message Notice {
  string title = 1;
  string message = 2;
  // "low", "normal" or "high".
  string priority = 3;
  // Shown in the transcript only, not sent as a notification (the
  // worker's own notes, such as Claude Code starting again).
  bool quiet = 4;
}

// A tool call a policy holds for your approval, and what became of it.
message Approval {
  string call_id = 1;
  // "requested", "allowed", "denied" or "expired" (no answer in time, or
  // the turn was interrupted).
  string state = 2;
  string tool = 3;
  // The call's input (JSON, shortened).
  string input = 4;
  string policy = 5;
  string message = 6;
}

// The agent changed a memory note (remember/forget); the head applies it.
message MemoryUpdate {
  // "remember" (add or replace) or "forget".
  string op = 1;
  string id = 2;
  // A label the note applies to; empty: every session.
  string scope = 3;
  string text = 4;
}

// A deliverable the agent published (publish_file): the file's content as
// it was then. The same name again is a new version.
message Output {
  string name = 1;
  string title = 2;
  string mime = 3;
  bytes data = 4;
}

// A background task (shell command, subagent or observed CLI task) started or ended.
message BackgroundTask {
  string task_id = 1;
  // "shell", "agent" or "claude_code".
  string kind = 2;
  // The command, or the subagent's description.
  string description = 3;
  // "started", "finished", "failed", "stopped" (by the agent), "stopped_by_user", or
  // "lost" (the worker or owning CLI exited without an outcome).
  string state = 4;
  // Numeric exit status when available; not meaningful for observed Claude Code tasks.
  int32 exit_code = 5;
  uint64 elapsed_ms = 6;
  // The agent is told when it ends.
  bool notify = 7;
  // A shell task's process group, so a restarted worker can stop it.
  int32 pgid = 8;
  // An observed Claude Code task: what kind the CLI says it is ("local_bash",
  // "local_agent", ...; its task_type), and whether it still holds the
  // turn (a foreground command or subagent, until the CLI moves it to the
  // background). Empty and false from older workers.
  string native_type = 9;
  bool foreground = 10;
}

// A snapshot of the session's working directory, taken before a turn's
// first user message (a commit in the worker's private checkpoint repo).
message Checkpoint {
  string commit = 1;
  // Set when no snapshot could be taken (the turn runs anyway).
  string error = 2;
}

// The conversation was rewound: events from `to_seq` up to this one no
// longer count (they stay in the log, for the record).
message Rewound {
  string command_id = 1;
  uint64 to_seq = 2;
  // Files were restored to the checkpoint before `to_seq`.
  bool restored_files = 3;
  // Why files could not be restored, if asked to.
  string restore_error = 4;
}

// The session runs on another model from here on. Recorded before the user
// message that asked for it.
message ModelSwitched {
  ModelSpec model = 1;
  uint64 context_window = 2;
  // Set when the switch crosses runtimes (Claude Code and carbon6's own
  // agent loop): what the session runs with from here on. Unset for a
  // switch within a runtime, which keeps the session's tools and prompt.
  Handoff handoff = 3;
}

// A switch between Claude Code and carbon6's own agent loop. The
// destination does not inherit the other runtime's conversation: it gets
// a transcript of everything before this point, rebuilt from the log.
message Handoff {
  // The runtime's tool profile ("claude_code", or the profile of the
  // model carbon6's loop now runs), its tools and its system prompt.
  string tool_profile = 1;
  repeated string tools = 2;
  string system_prompt = 3;
  // Into Claude Code: the id of the Claude Code conversation started here
  // (resumed by later turns until the next handoff).
  string claude_session_id = 4;
  // Into Claude Code, a conversation Claude Code already has: a session
  // imported from Claude Code that carbon6 has not run yet continues it
  // by its own id (the transcript only if Claude Code no longer has it).
  bool native = 5;
}

message SessionStarted {
  string command_id = 1;
  ModelSpec model = 2;
  string cwd = 3;
  // Full system prompt as sent to the model, for inspection.
  string system_prompt = 4;
  repeated string tools = 5;
  // Tool profile the session was started with ("generic", "claude",
  // "codex", "claude_code"); fixed until a switch hands the session over to
  // the other runtime (ModelSwitched.handoff), so the tool list stays a
  // stable prefix.
  string tool_profile = 6;
  // Set when the session runs in its own worktree.
  string worktree_branch = 7;
  string repo_root = 8;
  // Set for subagent sessions, which the worker creates itself.
  string parent_session_id = 9;
  string parent_call_id = 10;
  string title = 11;
  // Context window the worker assumes for the model (compaction threshold
  // and the UI's context gauge); 0 when unknown.
  uint64 context_window = 12;
  // For labels: the repository's git remote as host/owner/name (empty
  // outside a repository or without a remote), and the worker's home folder.
  string repo = 13;
  string home = 14;
  // On another machine over SSH: the target, and a line about its system.
  string ssh_target = 15;
  string system = 16;
  // Subagents: the named agent (empty: general-purpose) and how deep in
  // the tree (the top-level session is 0).
  string agent = 17;
  uint32 depth = 18;
  // The provider's own web search isn't offered: a tool list leaves out
  // web_search. False for older records, which keep hosted search.
  bool hosted_search_off = 19;
}

// Display metadata supplied by a task's producer, never parsed from its prose.
// Missing metadata on older events retains the neutral notice presentation.
message TaskNotice {
  string kind = 1;
  string title = 2;
  string session_id = 3;
  string status = 4;
  string markdown = 5;
}

message UserMessage {
  string command_id = 1;
  string text = 2;
  // Images and files sent with the message, and files it mentions with
  // @path (read when it was received, so replays see what the model saw).
  repeated Attachment attachments = 3;
  // The slash command the text invoked ("review", "frontend:component"),
  // if any.
  string command = 4;
  // What the model gets in place of the text, when a slash command
  // expanded it (or a UserPromptSubmit hook added context; empty: the
  // text itself).
  string prompt = 5;
  // Set when a UserPromptSubmit hook blocked the message: why. The model
  // never sees a blocked message.
  string blocked = 6;
  // In a subagent: the parent's tool call that sent it; empty when you did.
  string delegated_by = 7;
  // UserInput.wake, as sent.
  bool wake = 8;
  // A message from another session (docs/background.md §6): which, its
  // title then, and how many session messages led to it.
  string from_session_id = 9;
  string from_title = 10;
  uint32 hops = 11;
  // Present for HTTP API input; only the token's display name, never its secret.
  ApiMessageOrigin api_origin = 12;
  // Known human input: set only by the head for a signed-in browser.
  // Absent/false in old records and internal input means unknown, not human.
  bool human_origin = 13;
  TaskNotice task_notice = 14;
  // Distinguishes a newly recorded unknown/internal sender from a legacy
  // journal entry with no provenance. The head also marks new old-worker events.
  bool origin_recorded = 15;
}

message ApiMessageOrigin {
  // Empty when the API caller has no known token name (e.g. sign-in off).
  string token_name = 1;
}

message Attachment {
  // File name or, for @mentions, the path as written.
  string name = 1;
  // MIME type: image/* is shown to the model as an image; anything else is
  // UTF-8 text included in the message.
  string mime = 2;
  bytes data = 3;
}

message TurnStarted {
  uint64 turn = 1;
  uint64 context_window = 2; // 0 = not recorded
}

message AssistantMessage {
  uint64 turn = 1;
  repeated ContentBlock blocks = 2;
  string stop_reason = 3;
}

// Provider-specific reasoning blocks are kept verbatim so they can be sent
// back unchanged to the same provider family; other families skip them.
message ContentBlock {
  oneof block {
    string text = 1;
    string thinking = 2;              // unsigned (Chat Completions reasoning)
    ToolUse tool_use = 3;
    SignedThinking signed_thinking = 4; // Anthropic
    string redacted_thinking = 5;       // Anthropic, opaque data
    Reasoning reasoning = 6;            // OpenAI Responses
    Opaque opaque = 7;                  // provider-run tools (web search …)
  }
  // Display-only annotations on text (Responses url_citation, including
  // title, URL and character offsets). Absent in older events.
  string annotations_json = 8;
}

// A provider-specific block kept verbatim (e.g. Anthropic server_tool_use
// and web_search_tool_result, Responses web_search_call), replayed only to
// the same provider.
message Opaque {
  string provider = 1;
  string json = 2;
  string label = 3; // for display
}

message SignedThinking {
  string text = 1; // may be empty: the signature carries the reasoning
  string signature = 2;
}

message Reasoning {
  string id = 1;
  string encrypted_content = 2;
  string summary = 3;
}

message ToolUse {
  string id = 1;
  string name = 2;
  string input_json = 3;
}

message ToolResult {
  string call_id = 1;
  string tool = 2;
  string output = 3;
  bool is_error = 4;
  bool truncated = 5;
  uint64 duration_ms = 6;
  // Images the tool returned for the model to see (a screenshot, an image
  // it read), shown after its output.
  repeated Attachment images = 7;
}

message Usage {
  string model = 1;
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 cache_read_tokens = 4;
  uint64 cache_write_tokens = 5;
  uint64 reasoning_tokens = 6;
  // The window of the model that made the call, when the runtime reports
  // which one it was (Claude Code); 0: unknown.
  uint64 context_window = 7;
}

enum TurnEndReason {
  TURN_END_REASON_UNSPECIFIED = 0;
  TURN_END_REASON_COMPLETED = 1;
  TURN_END_REASON_INTERRUPTED = 2;
  TURN_END_REASON_ERROR = 3;
  TURN_END_REASON_WORKER_RESTARTED = 4;
}

message TurnEnded {
  uint64 turn = 1;
  TurnEndReason reason = 2;
}

message ErrorEvent {
  string message = 1;
}

// Everything before this event is replaced, for the model, by `summary`.
message Compaction {
  string summary = 1;
  uint64 tokens_before = 2;
}

// ---------------------------------------------------------------------------
// Ephemeral events: live streaming only, never journaled. Losing them loses
// nothing because the durable events carry the final content.
// ---------------------------------------------------------------------------

message EphemeralEvent {
  string session_id = 1;
  oneof kind {
    TextDelta text = 2;
    TextDelta thinking = 3;
    ToolOutputDelta tool_output = 4;
    SessionActivity activity = 5;
    SecretCard secret = 6;
    RateLimit rate_limit = 7;
  }
}

// A plan's limits as the model's runtime reported them (Claude Code's
// rate_limit_event), for the head to keep per connection; never shown in
// the session.
message RateLimit {
  // The report as given (JSON).
  string json = 1;
}

// A secret an operation returned (a token, a code), for you only: shown
// live, never logged or given to the model.
message SecretCard {
  string call_id = 1;
  string title = 2;
  string value = 3;
  string note = 4;
}

message TextDelta {
  uint64 turn = 1;
  string text = 2;
  // The seq the log's next event had when this streamed: the first reply
  // logged from there has this text, so a viewer that already has that reply
  // (or a turn's start or end from there) drops it. 0: not said.
  uint64 seq = 3;
}

message ToolOutputDelta {
  string call_id = 1;
  string text = 2;
}

message SessionActivity {
  bool running = 1;
  // What it is doing when that isn't streaming text (e.g. waiting to try
  // a failed model call again); empty: nothing to say.
  string status = 2;
}

// ---------------------------------------------------------------------------
// Sync
// ---------------------------------------------------------------------------

message SessionCursor {
  string session_id = 1;
  uint64 seq = 2;
}

message SessionEventBatch {
  string session_id = 1;
  repeated SessionEvent events = 2;
}

// Cumulative: every event with seq <= `seq` is durable on the head.
message EventAck {
  string session_id = 1;
  uint64 seq = 2;
}

// ---------------------------------------------------------------------------
// Commands (head -> worker). Delivered at least once; the worker applies each
// command_id at most once.
// ---------------------------------------------------------------------------

message SessionCommand {
  string command_id = 1;
  string session_id = 2;
  oneof kind {
    CreateSession create = 10;
    UserInput input = 11;
    Interrupt interrupt = 12;
    Restore restore = 13;
    Rewind rewind = 14;
    StopTask stop_task = 15;
    Approve approve = 16;
    Answer answer = 17;
    SetSubagentModel set_subagent_model = 18;
    DelegationEnded delegation_ended = 19;
    ReleaseNotices release_notices = 20;
  }
}

// How a turn of a remote subagent ended, for its parent (this session):
// the head relays it from the subagent's log (docs/remote-subagents.md).
message DelegationEnded {
  // The parent's call that waited on the turn (Task or SendMessage);
  // empty for a turn no call waited on (you messaged the subagent).
  string call_id = 1;
  string child_session_id = 2;
  TurnEndReason reason = 3;
  // The turn's final assistant text.
  string report = 4;
  // What it did (a <subagent …> digest), when the turn did not complete
  // with a report.
  string digest = 5;
  // For a turn no call waited on: its inputs with sender attribution
  // (older heads send plain text), and whether its report wakes the parent.
  repeated string said = 6;
  bool wake = 7;
  TaskNotice task_notice = 8;
}

// Deliver the session's held notices now (docs/background.md §5): they
// start a turn together, whatever the hourly limit.
message ReleaseNotices {}

// Sets the session's default for its subagents (unset `model`: the
// session's own model).
message SetSubagentModel {
  ModelSpec model = 1;
}

// Your answers to a question (a form) the assistant asked.
message Answer {
  string call_id = 1;
  // JSON object, field name to value.
  string values_json = 2;
  bool cancelled = 3;
}

// Your answer to an approval request.
message Approve {
  string call_id = 1;
  bool allow = 2;
}

// Stops a session's background task (from the UI).
message StopTask {
  string task_id = 1;
}

// Rewinds the conversation to before event `to_seq` (a user message),
// optionally restoring files to the checkpoint taken before it.
message Rewind {
  uint64 to_seq = 1;
  bool restore_files = 2;
}

// Re-seeds a worker that no longer has a session (lost or trimmed journal)
// with the head's authoritative log.
message Restore {
  CreateSession spec = 1;
  repeated SessionEvent events = 2;
}

message CreateSession {
  ModelSpec model = 1;
  string cwd = 2;
  // Base prompt from the head; the worker appends environment details and
  // project instruction files.
  string base_prompt = 3;
  // Run in a new git worktree on a new branch instead of `cwd` itself.
  bool worktree = 4;
  // Head configuration snapshot for this session (JSON arrays): MCP servers
  // and skills. Fixed for the session so the tool list stays stable.
  string mcp_servers_json = 5;
  string skills_json = 6;
  // Side chats: the conversation they branch from (the parent's events up
  // to the branch point, its own ancestors' first). History only; the
  // session's own log starts at its SessionStarted.
  repeated SessionEvent seed = 7;
  // Hooks from the head's settings (JSON array of c6_api::Hook).
  string hooks_json = 8;
  // Named agents for the Task tool (JSON array of c6_api::AgentDef).
  string agents_json = 9;
  // The session's labels from the head (yours, and worker:<name>); the
  // worker adds repo:, folder: and model:. Settings above are filtered by
  // them on the worker.
  repeated string labels = 10;
  // The head's secrets (JSON array of c6_api::SecretInfo: names,
  // descriptions, labels; no values). The worker fetches the values of
  // those that apply as credentials named "secret:<NAME>".
  string secrets_json = 11;
  // Work on another machine over SSH through this worker: user@host or an
  // ssh_config alias; `cwd` is a folder there.
  string ssh_target = 12;
  // The head's web search setting (JSON object of c6_tools::SearchConfig;
  // the API key is a secret, named here).
  string web_search_json = 13;
  // Memory notes (JSON array of c6_api::Memory); the worker keeps those
  // whose scope matches the session's labels.
  string memories_json = 14;
  // Policies (JSON array of c6_api::Policy); the worker applies those whose
  // labels match the session's.
  string policies_json = 15;
  // The model for subagents (Task tool) from a routing rule; empty: the
  // session's own. A named agent's model still wins.
  string subagent_model = 16;
  // Context from the memex for this session (its labels and first
  // message), for the system prompt; replaces the memory section.
  string memex_brief = 17;
  // A memex is connected: offer the memex tools (they call it through the
  // head, which applies the session's scope).
  bool memex_tools = 18;
  // The session's scope includes mail (email) and calendars (event): offer
  // the mail and calendar tools.
  bool memex_mail = 19;
  bool memex_calendar = 20;
  // Prompts the worker gives the model, by name (JSON object): the
  // compaction prompts and the subagent note, as edited (docs/os.md §4.6).
  // Missing ones are the defaults.
  string prompts_json = 21;
  // Set for a subagent, which the worker creates itself (never the head).
  Delegation delegation = 22;
  // Subagents (the head's subagent-limits setting): how deep they nest
  // (the session itself is depth 0) and how many delegations may run at
  // once in one tree. 0: the defaults (3 and 16).
  uint32 max_subagent_depth = 23;
  uint32 max_running_subagents = 24;
  // The session's scope includes chat (Slack): offer the chat tools.
  bool memex_chat = 25;
  // The default for subagents (connection, model, effort), from a routing
  // rule or picked in the session; unset: `subagent_model` on the
  // session's own connection. A named agent's model, or a Task call's,
  // still wins.
  ModelSpec subagent_target = 26;
  // The connections subagents may run on (JSON array of
  // c6_api::SubagentConnection): those the session's realm may use,
  // without Claude Code (a subagent runs in carbon6's own loop).
  string subagent_connections_json = 27;
  // Only these tools, in any profile's naming; empty: all tools.
  repeated string tools = 28;
  // A remote subagent's depth in its tree (the head starts it from a
  // template; `delegation` stays unset, since it is a session of its own).
  uint32 depth = 29;
  // Templates its agent may start as remote subagents (JSON array of
  // c6_api::SubagentTemplate), and the line introducing them in Task's
  // description.
  string subagent_templates_json = 30;
  // From the subagent-limits setting: how many turns notices may start in
  // an idle session per hour, and how long an idle Claude Code process with
  // no background tasks stays up. 0: the defaults (20 and 15).
  uint32 auto_turns_per_hour = 31;
  uint32 claude_code_idle_minutes = 32;
  // carbon6's tools its Claude Code gets over the MCP bridge (Settings →
  // Agents; names in any profile's naming); empty: the defaults (the
  // subagent tools, documents and session messages).
  repeated string claude_code_tools = 33;
  // `claude_code_tools` is the choice (an empty one: none); unset (an
  // older head): the defaults.
  bool claude_code_tools_chosen = 34;
  // The choice as a newer head makes it (it also fills 33 and 34 for older
  // workers); a newer worker uses this when set.
  ClaudeCodeToolChoice claude_code = 35;
  // With `worktree`: how it is made (docs/dev-starts.md §2); unset: a
  // `c6/<id>` branch from HEAD.
  WorktreeSpec worktree_spec = 36;
}

// How a new git worktree is made: the branch ({{id}} is the session's
// short id), what it starts from (empty: HEAD), whether to fetch that from
// its remote first and track it, and shell lines run in it before the
// first turn.
message WorktreeSpec {
  string branch = 1;
  string base = 2;
  bool fetch = 3;
  bool track = 4;
  repeated string setup = 5;
}

// carbon6's tools a Claude Code session gets over the MCP bridge
// (Settings → Agents), and which of them are loaded up front.
message ClaudeCodeToolChoice {
  // Every carbon6 tool the session has in carbon6's own loop, without those
  // Claude Code has its own of (a routing rule's tool list still narrows).
  bool automatic = 1;
  // Not automatic: these (names in any profile's naming).
  repeated string tools = 2;
  // Loaded into Claude Code's prompt up front (MCP `_meta`
  // anthropic/alwaysLoad); the rest wait behind its tool search.
  repeated string core = 3;
  // `core` is the choice (an empty one: none); unset: the defaults.
  bool core_chosen = 4;
  // Claude Code's own tools as they are without carbon6 (today's
  // behaviour, an escape hatch for now). Unset: only its coding tools
  // (Bash, Read, Write, Edit, ToolSearch), narrowed by a routing rule's
  // tool list, with nothing else from settings files, MCP servers, skills
  // or plugins (docs/background.md §4, Claude Code's own tools).
  bool native_all = 5;
  // Extra Claude Code settings (a JSON object) merged into the --settings
  // carbon6 passes, without the keys carbon6 sets itself. Empty: the
  // default, no Claude co-author or attribution lines.
  string settings_json = 6;
}

// What makes a session a subagent: who started it, and as which agent.
message Delegation {
  string parent_session_id = 1;
  string parent_call_id = 2;
  // The top-level session of the tree (secrets and head calls go by it:
  // its row always exists on the head).
  string root_session_id = 3;
  // The named agent (JSON c6_api::AgentDef-like: name, description, tools,
  // model, prompt); empty for a general-purpose one.
  string agent_json = 4;
  uint32 depth = 5;
  // Claude Code's own subagent, mirrored from its stream: shown, never run.
  bool observed = 6;
}

message ModelSpec {
  string connection_id = 1;
  string model = 2;
  uint32 max_output_tokens = 3;
  // "low" | "medium" | "high" | "xhigh" | "max"; empty = model default.
  string effort = 4;
  // Connection kind (openai_compat, openai, chatgpt, anthropic), so the
  // worker can pick the tool profile before fetching credentials.
  string connection_kind = 5;
  // Compact the conversation once it fills this percentage of the model's
  // context window (the connection's setting); 0 = the default.
  uint32 compact_at_percent = 6;
}

message UserInput {
  string text = 1;
  repeated Attachment attachments = 3;
  // Set to switch the session to this model from this message on.
  ModelSpec model = 2;
  // A custom slash command the text invokes (from the head's settings):
  // its name, and every enabled variant of that name as a JSON array of
  // {applies_to, body}. The worker picks the one for the session's labels
  // and fills in the arguments.
  string command = 4;
  string command_candidates_json = 5;
  // The session's labels from the head as of this message (yours, and
  // worker:<name>).
  repeated string labels = 6;
  // 7 was context (follow-through, removed).
  reserved 7;
  // To a subagent with no call waiting on it: start a turn in its idle
  // parent when its report arrives (else the parent hears with its next
  // input).
  bool wake = 8;
  // To a remote subagent from its parent: the parent's call (the head
  // relays Task and SendMessage calls made on another worker).
  string delegated_by = 9;
  // From another session's agent (docs/background.md §6): a notice, not
  // your message. Its sender, the sender's title, and how many session
  // messages led to it.
  string from_session_id = 10;
  string from_title = 11;
  uint32 hops = 12;
  // Claude Code tools as the head's settings have them now: a session
  // applies them from this message on, not only those it started with.
  ClaudeCodeToolChoice claude_code = 13;
  // Send now (docs/background.md §4): while a turn runs, deliver it at
  // once rather than at the agent's next step. Claude Code moves what holds
  // the turn to the background, or stops only that turn; carbon6's own loop
  // stops the turn and this starts the next. Older workers treat it as an
  // ordinary message (the head interrupts first for them).
  bool send_now = 14;
  // Present for HTTP API input, retained in UserMessage for remote reports.
  ApiMessageOrigin api_origin = 15;
  // What the model gets instead of `text`, when set: the text with what it
  // @-mentions (chat threads, mail, events, projects, docs, work), read by
  // the head within the session's knowledge scope. The log shows `text`.
  string prompt = 16;
  // Set only by the head for a signed-in browser, retained in UserMessage.
  // Old heads/workers omit it; unknown input must not be called human.
  // Tag 16 was used for this bool only in deployed carbon6 fork builds;
  // stored-command decoding upgrades those bytes before protobuf decoding.
  bool human_origin = 18;
}

message Interrupt {
  // Send now for a message already with the agent (its command id): deliver
  // it at once instead of stopping the turn and its background agents.
  // Older workers ignore it and interrupt.
  string send_now = 1;
}

message CommandRejected {
  string command_id = 1;
  string session_id = 2;
  string reason = 3;
}

// ---------------------------------------------------------------------------
// Credentials
// ---------------------------------------------------------------------------

message CredentialRequest {
  uint64 request_id = 1;
  string connection_id = 2;
  // The provider refused the last grant (HTTP 401): sign in again rather
  // than hand out the stored token (ChatGPT's, refreshed now).
  bool refresh = 3;
  // The session asking (a subagent asks as its root session): the head
  // gives a worker only its live sessions' connections and secrets, as
  // their realms allow. Empty from older workers (and the head's own).
  string session_id = 4;
}

message CredentialGrant {
  uint64 request_id = 1;
  string connection_id = 2;
  // Empty on failure, with `error` set.
  string error = 3;
  string kind = 4; // "openai_compat"
  string base_url = 5;
  string bearer = 6;
  map<string, string> headers = 7;
  int64 expires_at_ms = 8; // 0 = no expiry
  uint64 context_window = 9; // 0 = automatic
}
