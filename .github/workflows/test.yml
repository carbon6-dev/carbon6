# The test suite on Linux and macOS, for every pull request; CI
# (.github/workflows/ci.yml) runs it for every push to main.
name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # Lints don't depend on the OS: once, on Linux.
      - name: Every target passes clippy without warnings (and the web UI for wasm), and the tests' lint
        if: runner.os == 'Linux'
        run: make check
      - name: A git identity, for tests that commit
        run: git config --global user.email test@c6 && git config --global user.name test
      # On Linux, nextest runs every test binary at once (each test its own
      # process). macOS stays on cargo test: a process there pays a few
      # seconds loading the system's certificates, once per test with nextest.
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - if: runner.os == 'Linux'
        run: cargo nextest run --locked --workspace --no-fail-fast && cargo test --locked --doc
      - if: runner.os != 'Linux'
        run: cargo test --locked

  under-load:
    # The same suite with every core kept busy (docs/testing.md): a test
    # that waits on time instead of on what it checks fails here.
    name: cargo test under load (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - name: A git identity, for tests that commit
        run: git config --global user.email test@c6 && git config --global user.name test
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: make test-under-load NEXTEST=1
