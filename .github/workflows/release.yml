# A release, started by the v<version> tag `make release` pushes: the tests,
# .debs and a Linux tarball for amd64 and arm64 (smoke-tested under systemd),
# Homebrew bottles for Apple Silicon and Intel (smoke-tested with brew
# services), then the GitHub release and the Homebrew tap.
#
# Run by hand (workflow_dispatch) it is a dry run: it builds and tests
# everything and keeps the artifacts on the run, but publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - if: github.ref_type == 'tag'
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  test:
    needs: check
    uses: ./.github/workflows/test.yml

  linux:
    name: .debs (${{ matrix.runner }})
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tag and history, for the package version
      - name: Build the .debs and the Linux tarball, and try them under systemd
        run: make docker-deb-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            dist/deb/ubuntu-22.04/*.deb
            dist/deb/ubuntu-22.04/*.tar.gz
          if-no-files-found: error

  macos:
    name: Bottles (${{ matrix.runner }})
    needs: check
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust
        with:
          trunk: "true"
      - name: Build the bottles, and try them with brew services
        run: make brew-test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/brew/*.tar.gz
          if-no-files-found: error

  publish:
    name: GitHub release and tap
    if: github.ref_type == 'tag'
    needs: [test, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: packaging/release/publish.sh "${GITHUB_REF_NAME#v}" dist/release
