# Every push to main: the tests, and the packages built once, in parallel.
# A release commit ("Release <version>", which `make release` pushes) is then
# tagged v<version> and published from those very packages, as soon as all of
# it is green (docs/releases.md). Nothing is built twice and nobody waits to
# push a tag. A release commit that changes only the version and the
# changelog, on a commit CI already passed, isn't tested again: that code was.
#
# Run by hand (workflow_dispatch) it builds and tests main and keeps the
# packages on the run, publishing nothing.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: What this commit is
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # CI's runs on the commit before
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      tested: ${{ steps.t.outputs.tested }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(git log -1 --format=%s)" = "Release $version" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::warning::v$version is already tagged: building, not publishing"
            else
              release=true
            fi
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "release=$release" >>"$GITHUB_OUTPUT"
          echo "carbon6 $version, release: $release"
      # A release commit only bumps the version and adds to the changelog: if
      # CI passed on the commit before it, its tests have nothing new to say.
      - id: t
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          other=$(git diff --name-only HEAD^ HEAD | grep -vxE 'Cargo\.toml|Cargo\.lock|CHANGELOG\.md' || true)
          # Every other changed line of Cargo.toml and Cargo.lock is a version.
          lines=$(git diff -U0 HEAD^ HEAD -- Cargo.toml Cargo.lock | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[+-]version = "' || true)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$(git rev-parse HEAD^)&status=success" --jq '.total_count')
          if [ -z "$other" ] && [ -z "$lines" ] && [ "$passed" -gt 0 ]; then
            tested=true
            echo "Only the version changed since $(git rev-parse --short HEAD^), which CI passed: not testing again"
          else
            echo "Testing: other changes (${other:-none}; ${lines:+code lines changed}) or no green CI on the commit before ($passed)"
          fi
          echo "tested=$tested" >>"$GITHUB_OUTPUT"

  test:
    needs: meta
    if: needs.meta.outputs.tested != 'true'
    uses: ./.github/workflows/test.yml

  linux:
    # On Ubuntu 22.04 itself (its glibc is the packages' minimum), with the
    # cargo cache, instead of from scratch in Docker.
    name: .debs (${{ matrix.runner }})
    needs: meta
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE: ${{ needs.meta.outputs.release == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the history, for between-release package versions
      - uses: ./.github/actions/rust
        with:
          trunk: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: sudo apt-get install -y --no-install-recommends dpkg-dev
      - name: Build the .debs and the Linux tarball, and try them under systemd
        run: make deb-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            dist/deb/ubuntu-22.04/*.deb
            dist/deb/ubuntu-22.04/*.tar.gz
          if-no-files-found: error

  macos:
    # Apple Silicon only (Intel Macs are not built).
    name: Bottles (macos-15)
    needs: meta
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE: ${{ needs.meta.outputs.release == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust
        with:
          trunk: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build the bottles, and try them with brew services
        run: make brew-test
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/brew/*.tar.gz
          if-no-files-found: error

  publish:
    name: Tag and publish
    # The tests passed here, or on the same code one commit before (skipped).
    if: >-
      !cancelled() && needs.meta.outputs.release == 'true' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.meta.outputs.tested == 'true')) &&
      needs.linux.result == 'success' && needs.macos.result == 'success'
    needs: [meta, test, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Tag the release commit
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "carbon6 $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: packaging/release/publish.sh "${{ needs.meta.outputs.version }}" dist/release
