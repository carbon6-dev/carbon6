# Local development head. State lives in the standard data directory
# (~/Library/Application Support/c6h on macOS, ~/.local/share/c6h on Linux),
# so `cargo clean` leaves it alone.
# All interfaces, so the UI can be opened from other machines on the network
# (and tailnet); sign-in protects it. For loopback only, use
# bind = ["127.0.0.1"] and drop the next line.
bind = ["0.0.0.0"]
allow_public_bind = true
# HTTPS from the head's own private CA (nothing is published in public
# certificate logs), so passkeys work at https://<tailnet name>:7700. Trust
# the CA once per device (see README → Configuration). On this Mac:
#   curl -so /tmp/carbon6-ca.pem http://localhost:7700/ca.pem
#   sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/carbon6-ca.pem
ui_tls_head_ca = true
