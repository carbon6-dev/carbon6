[package]
name = "c6-memex"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23"
c6-api.workspace = true
c6-core = { workspace = true, features = ["upgrade"] }
# The parsers, in this process: tests only (the head runs them as a kit).
c6-extract = { path = "../c6-extract", optional = true }
c6-llm.workspace = true
c6-worker.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
mail-builder = "1.0.0"
pulldown-cmark = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "query", "multipart"] }
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7"] }

[features]
in-process-extract = ["dep:c6-extract"]

[dev-dependencies]
c6-memex = { path = ".", features = ["in-process-extract"] }
c6-extract = { path = "../c6-extract" }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
kamadak-exif = "0.6.1"
tempfile = "3.27.0"
c6-head.workspace = true
c6-testkit.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-util = "0.7.20"
url = "2.5.8"
axum = "0.8"
