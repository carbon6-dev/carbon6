[package]
name = "c6-head"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
semver = "1"
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
c6-agent.workspace = true
c6-api = { workspace = true, features = ["schema"] }
c6-core = { workspace = true, features = ["upgrade"] }
c6-llm.workspace = true
c6-mcp.workspace = true
c6-proto.workspace = true
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
if-addrs = "0.15.0"
mime_guess = "2.0.5"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
pem = "4.0.0"
prost = "0.14.4"
rand = "0.10.3"
rcgen = { version = "0.14.10", features = ["x509-parser", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.0", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "http2"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
regex = "1.13.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
toml = "1.1.8"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
x509-parser = "0.18.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
schemars = "1.2.2"
c6-tools.workspace = true
async-trait = "0.1.92"
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
tempfile = "3.27.0"
