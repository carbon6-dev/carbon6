[package]
name = "c6-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
c6-api.workspace = true
console_error_panic_hook = "0.1.7"
futures = "0.3.34"
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.106"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
send_wrapper = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Navigator", "Clipboard", "Location", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Storage", "Document", "Element", "HtmlElement", "MediaQueryList", "Notification", "NotificationOptions", "NotificationPermission", "HtmlDetailsElement", "UrlSearchParams", "History", "File", "FileList", "Blob"] }
