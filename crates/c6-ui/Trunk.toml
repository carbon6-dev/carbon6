[build]
target = "index.html"
dist = "dist"

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["../../scripts/precompress-ui.sh"]

[tools]
tailwindcss = "4.1.14"

# `trunk serve` for UI development against a running head on the default port.
[[proxy]]
backend = "http://127.0.0.1:7700/api/"
ws = true
