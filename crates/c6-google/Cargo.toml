# The google kit: Gmail, Google Calendar and Google Contacts, for the
# gmail, google-calendar and google-contacts apps (docs/knowledge.md §6).
# Built on its own in the kit's image, so nothing here comes from the
# workspace; its Cargo.lock is that build's. The head offers the kit as
# kit.json's version: when the source changes, bump it (and kit.digest;
# c6-head's tests say what to write).
[package]
name = "c6-google"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/carbon6-dev/carbon6"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "time"] }
