[package]
name = "c6-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
c6-core.workspace = true
c6-proto.workspace = true
dirs = "7.0.0"
gethostname = "1.1.0"
pem = "4.0.0"
rand = "0.10.3"
rcgen = { version = "0.14.10", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
toml = "1.1.8"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tracing = "0.1.44"

[dev-dependencies]
c6-api.workspace = true
c6-core.workspace = true
c6-head.workspace = true
tempfile = "3.27.0"
tokio-util = "0.7.20"
tracing-subscriber = "0.3.23"
