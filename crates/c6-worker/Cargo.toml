[package]
name = "c6-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
c6-agent.workspace = true
c6-core.workspace = true
c6-llm.workspace = true
c6-mcp.workspace = true
c6-proto.workspace = true
c6-tools.workspace = true
dirs = "7.0.0"
gethostname = "1.1.0"
nix = { version = "0.31.3", features = ["signal", "process"] }
pem = "4.0.0"
portable-pty = "0.9.0"
prost = "0.14.4"
rand = "0.10.3"
rcgen = { version = "0.14.10", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
time = "0.3.55"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
toml = "1.1.8"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
async-trait = "0.1.92"
axum = "0.8"
c6-api.workspace = true
c6-core.workspace = true
c6-head.workspace = true
c6-proto.workspace = true
c6-testkit.workspace = true
futures = "0.3.34"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
tracing-subscriber = "0.3.23"
